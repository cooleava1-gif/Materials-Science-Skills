version: "1.2.0"
status: stable

always_load:
  - static/core/contract.md
  - ../_shared/core/direction-profile.md
  - static/core/workflow.md

axes:
  task:
    default: citation-map
    values:
      reference-verify:
        path: references/reference-verification.md
        triggers: ["verify references", "reference verification", "DOI check", "参考文献校验", "逐条验证", "卷年冲突"]
      search-plan:
        path: references/journal-search-profiles.md
        triggers: ["search", "database", "keyword", "检索"]
      citation-map:
        path: references/claim-citation-mapping.md
        triggers: ["citation matrix", "claim", "reference", "引用"]
      reference-gap:
        path: references/reference-gap-audit.md
        triggers: ["gap", "missing citation", "weak reference", "引用不足"]
      wer-ea-screening:
        path: references/wer-ea-screening-and-source-quality.md
        triggers: ["WER-EA screening", "waterborne epoxy emulsified asphalt screening", "水性环氧乳化沥青筛选"]
      source-quality:
        path: references/wer-ea-screening-and-source-quality.md
        triggers: ["source quality", "primary experimental evidence", "文献质量"]
      reviewer-safe-package:
        path: references/reference-gap-audit.md
        triggers: ["reviewer-safe citation package", "reviewer risk", "审稿安全"]
      academic-search-mcp:
        path: references/academic-search-mcp.md
        triggers: ["academic-search MCP", "MCP", "academic search", "自动检索"]
      ceramics-screening:
        path: references/ceramics-screening-and-source-quality.md
        triggers: ["ceramics screening", "phase identification evidence", "陶瓷筛选"]
      civil-screening:
        path: references/civil-screening-and-source-quality.md
        triggers: ["civil screening", "construction materials screening", "土木筛选"]
      polymers-screening:
        path: references/polymers-screening-and-source-quality.md
        triggers: ["polymer screening", "composite screening", "高分子筛选"]
      metals-screening:
        path: references/metals-screening-and-source-quality.md
        triggers: ["metal screening", "alloy screening", "金属筛选"]
      functional-screening:
        path: references/functional-screening-and-source-quality.md
        triggers: ["functional screening", "electronic materials screening", "功能材料筛选"]
      nano-screening:
        path: references/nano-screening-and-source-quality.md
        triggers: ["nano screening", "nanomaterial screening", "纳米筛选"]
      semiconductors-screening:
        path: references/semiconductors-screening-and-source-quality.md
        triggers: ["semiconductors screening", "thin-film device evidence", "半导体筛选"]
      dielectrics-screening:
        path: references/dielectrics-piezoelectrics-screening-and-source-quality.md
        triggers: ["dielectric screening", "piezoelectric screening", "介电筛选"]
      photonic-screening:
        path: references/photonic-optoelectronic-screening-and-source-quality.md
        triggers: ["photonic screening", "optoelectronic screening", "光电子筛选"]
      nanoparticles-screening:
        path: references/nanoparticles-screening-and-source-quality.md
        triggers: ["nanoparticle screening", "colloidal nanomaterial screening", "纳米颗粒筛选"]
      nano-thin-films-screening:
        path: references/nano-thin-films-screening-and-source-quality.md
        triggers: ["nano thin film screening", "nanostructured coating screening", "纳米薄膜筛选"]
      2d-materials-screening:
        path: references/2d-materials-screening-and-source-quality.md
        triggers: ["2D materials screening", "graphene screening", "二维材料筛选"]
      nanocomposites-screening:
        path: references/nanocomposites-screening-and-source-quality.md
        triggers: ["nanocomposite screening", "nanofiller dispersion evidence", "纳米复合材料筛选"]
  journal_family:
    default: materials
    values:
      cbm-jbe:
        path: references/journal-search-profiles.md
        triggers: ["CBM", "Construction and Building Materials"]
      ccc:
        path: references/journal-search-profiles.md
        triggers: ["CCC", "Cement and Concrete Composites"]
      rmpd-ijpe:
        path: references/journal-search-profiles.md
        triggers: ["RMPD", "Road Materials and Pavement Design"]
  material_domain:
    detect: "Which material domain does the literature search target?"
    default: general
    values:
      general:
        path: ../_shared/core/direction-profile.md
        triggers: ["general fallback", "profile fallback", "neutral routing"]
      asphalt:
        path: static/fragments/domain/asphalt.md
        triggers: ["asphalt", "emulsified asphalt", "沥青"]
      cement-concrete:
        path: static/fragments/domain/cement-concrete.md
        triggers: ["cement", "concrete", "水泥"]
      materials:
        path: static/fragments/domain/materials.md
        triggers: ["materials", "construction materials", "土木材料"]
      ceramics:
        path: static/fragments/domain/ceramics.md
        triggers: ["ceramic", "sintering", "陶瓷"]
      thermal-insulation:
        path: static/fragments/domain/thermal-insulation.md
        triggers: ["thermal insulation", "aerogel", "隔热"]
      polymers:
        path: static/fragments/domain/polymers.md
        triggers: ["polymer", "thermoplastic", "高分子"]
      metals:
        path: static/fragments/domain/metals.md
        triggers: ["metal", "alloy", "金属"]
      nano:
        path: static/fragments/domain/nano.md
        triggers: ["nano", "nanoparticle", "纳米"]
      functional:
        path: static/fragments/domain/functional.md
        triggers: ["semiconductor", "dielectric", "半导体"]
  material_family:
    detect: "Which materials family is central?"
    default: neutral
    values:
      neutral:
        path: ../_shared/core/direction-profile.md
        triggers: ["neutral family", "profile family fallback", "no saved family"]
      civil:
        path: ../materials-research/static/fragments/domain/civil-family.md
        triggers: ["civil", "construction", "土木"]
      polymers:
        path: ../materials-research/static/fragments/domain/polymers-family.md
        triggers: ["polymer", "resin", "高分子"]
      metals:
        path: ../materials-research/static/fragments/domain/metals-family.md
        triggers: ["metal", "alloy", "金属"]
      ceramics:
        path: ../materials-research/static/fragments/domain/ceramics-family.md
        triggers: ["ceramic", "porcelain", "陶瓷"]
      functional:
        path: ../materials-research/static/fragments/domain/functional-family.md
        triggers: ["semiconductor", "dielectric", "半导体"]
      nano:
        path: ../materials-research/static/fragments/domain/nano-family.md
        triggers: ["nano", "nanoparticle", "纳米"]

references: {}

assets:
  - assets
scripts:
  - scripts
quality_gates:
  - release gate must report no issues for this skill
  - claims must stay inside the skill evidence contract

handoffs:
  provides:
    citation-handoff:
      description: "Citation matrix and claim-source mapping"
      contract: ../../_shared/contracts/citation-handoff.yaml
      version: "1.0"
  consumes:
    - handoff: literature-pipeline-handoff
      from: materials-literature-pipeline
      optional: true
release_checks:
  - scripts/run_release_checks.py --json
  - scripts/check_skill_architecture.py --json
